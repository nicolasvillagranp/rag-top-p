# Small real-dataset smoke config — MultiHop-RAG (609-doc fixed corpus).
experiment:
  name: "smoke_multihop"
  seed: 42

embedding:
  model: "all-MiniLM-L6-v2"
  batch_size: 64

retrieval:
  M_values: [20]
  M_max: 20

top_p:
  p_values: [0.7, 0.9]
  tau_values: [1.0]
  k_values: [5]

datasets:
  - multihop_rag

evaluation:
  max_queries: 50

paths:
  cache_dir: "data/cache"
  output_dir: "outputs"
  fixtures_dir: "data/fixtures"
