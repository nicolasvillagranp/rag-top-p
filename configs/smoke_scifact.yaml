# Small real-dataset smoke config — SciFact (peaked, single-gold regime).
experiment:
  name: "smoke_scifact"
  seed: 42

embedding:
  model: "all-MiniLM-L6-v2"
  batch_size: 64

retrieval:
  M_values: [20, 50]
  M_max: 50
  n_distractors: 49  # gold (~1) + 49 distractors → pool of ~50

top_p:
  p_values: [0.5, 0.7, 0.9]
  tau_values: [0.1, 1.0]
  k_values: [3, 5]

datasets:
  - scifact

evaluation:
  max_queries: 100

paths:
  cache_dir: "data/cache"
  output_dir: "outputs"
  fixtures_dir: "data/fixtures"
